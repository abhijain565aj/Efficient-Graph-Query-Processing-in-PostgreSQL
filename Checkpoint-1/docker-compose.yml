services:
  postgres:
    image: postgres:16
    container_name: graph_pg_project
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graphdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graphdb"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
